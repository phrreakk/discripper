[project]
name = "discripper"
version = "0.1.0"
description = "Back up media discs with makemkvcon and HandBrake, named for Jellyfin using TMDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable==3.11.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pylint>=4.1.4",
]

[tool.uv]
package = false

[tool.pylint."messages control"]
disable = ["all"]
enable = ["possibly-used-before-assignment", "used-before-assignment"]
